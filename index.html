  <script>
    tailwind.config = {

        extend: {
          colors: {
            brand: {

              900: '#0c4a6e'

        }
      }

  <style>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3.5 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="h-9 w-9 bg-slate-900 rounded-lg flex items-center justify-center text-white font-black text-lg tracking-tighter shadow-sm">
          MO
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-lg font-black tracking-tight text-slate-900">My<span class="text-sky-600">Opps</span></h1>
            <span class="px-2 py-0.5 text-[10px] font-bold rounded-full bg-sky-100 text-sky-800 uppercase tracking-wide">Beta v0.2</span>
          </div>
          <p class="text-xs text-slate-500 font-medium hidden sm:block">Universal Student Opportunity & Fellowship Directory</p>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">
          <span class="h-2 w-2 rounded-full bg-emerald-500 animate-pulse"></span>
          Database Online
        </span>
      </div>
    </div>
  </header>

  <!-- Main Content Layout -->

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
      
      <!-- Filter Sidebar (4 Cols) -->

        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm sticky top-20 max-h-[calc(100vh-6rem)] overflow-y-auto">
          
          <!-- Filter Controls Header -->
          <div class="flex justify-between items-center pb-3 border-b border-slate-100 mb-4">
            <div>
              <h2 class="font-black text-slate-800 text-sm uppercase tracking-wider">Search Filters</h2>
              <p class="text-[11px] text-slate-400">Match across 15 criteria</p>
            </div>
            <button id="reset-filters" class="text-xs text-sky-600 hover:text-sky-800 font-bold transition-colors">Reset All</button>
          </div>

          <!-- CORE FILTERS (Always Visible) -->
          <div class="space-y-4">
            
            <!-- 1. Keyword Search -->
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1.5">1. Keyword Search</label>
              <input type="text" id="search-input" placeholder="Organization, title, tags..." 
                     class="w-full text-xs px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-sky-500 focus:outline-none transition-all">
            </div>

            <!-- 2. Major / Discipline Cluster -->
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1.5">2. Major / Field of Study</label>
              <select id="major-filter" class="w-full text-xs px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-sky-500 focus:outline-none bg-white">
                <option value="ALL">All Disciplines & Fields</option>
                <optgroup label="Computing & Technology">
                  <option value="Computer Science / Software Engineering">Computer Science / Software Eng.</option>
                  <option value="Data Science / Analytics / Business Intelligence">Data Science / Analytics / BI</option>
                  <option value="Artificial Intelligence / Robotics">Artificial Intelligence / Robotics</option>
                  <option value="Cybersecurity / Information Assurance">Cybersecurity / Info Assurance</option>
                </optgroup>
                <optgroup label="Math & Physical Sciences">
                  <option value="Mathematics / Applied Mathematics / Statistics">Mathematics / Applied Math / Stats</option>
                  <option value="Physics / Astronomy / Astrophysics">Physics / Astronomy / Astrophysics</option>
                  <option value="Chemistry / Biochemistry">Chemistry / Biochemistry</option>
                  <option value="Earth & Environmental Sciences">Earth & Environmental Sciences</option>
                </optgroup>
                <optgroup label="Engineering">
                  <option value="Electrical & Computer Engineering">Electrical & Computer Eng.</option>
                  <option value="Mechanical & Aerospace Engineering">Mechanical & Aerospace Eng.</option>
                  <option value="Biomedical Engineering">Biomedical Engineering</option>
                  <option value="Civil & Environmental Engineering">Civil & Environmental Eng.</option>
                </optgroup>
                <optgroup label="Health, Law, Business & Social">
                  <option value="Biological Sciences / Pre-Med">Biological Sciences / Pre-Med</option>
                  <option value="Public Health / Epidemiology">Public Health / Epidemiology</option>
                  <option value="Finance / Fintech / Quant">Finance / Fintech / Quant</option>
                  <option value="Business Administration / Consulting">Business Admin / Management</option>
                  <option value="Public Policy / Pre-Law / International">Public Policy / Pre-Law</option>
                </optgroup>
              </select>
            </div>

            <!-- 3. Academic Standing -->
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1.5">3. Academic Standing</label>
              <select id="standing-filter" class="w-full text-xs px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-sky-500 focus:outline-none bg-white">
                <option value="ALL">Any Education Level</option>
                <option value="Community College">Community College / Associate</option>
                <option value="Freshman">Freshman</option>
                <option value="Sophomore">Sophomore</option>
                <option value="Junior">Junior</option>
                <option value="Senior">Senior / Graduating Senior</option>
                <option value="Recent Graduate">Recent Graduate / Post-Bacc</option>
                <option value="Master's Student">Master's Student (MS/MA/MBA)</option>
                <option value="Doctoral Student">Doctoral Student (PhD)</option>
                <option value="Law Student">Law Student (1L/2L/3L)</option>
                <option value="Medical Student">Medical Student (MD/DO)</option>
              </select>
            </div>

            <!-- 4. Category -->
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1.5">4. Opportunity Category</label>
              <select id="category-filter" class="w-full text-xs px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-sky-500 focus:outline-none bg-white">
                <option value="ALL">All Categories</option>
                <option value="Academic Research (REU)">Academic Research (REU)</option>
                <option value="National Lab / Federal Agency">National Lab / Federal Agency</option>
                <option value="Prestigious Fellowship">Prestigious Fellowship</option>
                <option value="Scholarship / Tuition Grant">Scholarship / Tuition Grant</option>
                <option value="Corporate / Industry Internship">Corporate / Industry Internship</option>
              </select>
            </div>

            <!-- 5. Citizenship & Work Authorization -->

              <label class="block text-xs font-bold text-slate-700 mb-1.5">5. Citizenship Status</label>
              <select id="citizenship-filter" class="w-full text-xs px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-sky-500 focus:outline-none bg-white">
                <option value="ALL">Any Citizenship Status</option>
                <option value="US Citizen">US Citizen</option>
                <option value="Permanent Resident">Permanent Resident (Green Card)</option>
                <option value="DACA Eligible">DACA / Undocumented Eligible</option>
                <option value="International Eligible">International / F-1 Student Eligible</option>
              </select>
            </div>

            <!-- 6. GPA Slider -->
            <div>
              <div class="flex justify-between items-center text-xs font-bold text-slate-700 mb-1">
                <span>6. Your Cumulative GPA</span>
                <span id="gpa-val" class="font-mono text-sky-600 bg-sky-50 px-2 py-0.5 rounded border border-sky-100">3.00</span>
              </div>
              <input type="range" id="gpa-slider" min="2.0" max="4.0" step="0.05" value="3.00" 
                     class="w-full h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-sky-600">
              <p class="text-[10px] text-slate-400 mt-1">Hides programs requiring higher than your GPA.</p>
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1.5">7. Funding & Pay</label>
              <select id="compensation-filter" class="w-full text-xs px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-sky-500 focus:outline-none bg-white">

                <option value="Fully Funded">Fully Funded (Tuition + Stipend + Housing)</option>
                <option value="Stipend Provided">Stipend Provided</option>
                <option value="Hourly / Salaried">Hourly / Salaried</option>
                <option value="Tuition Grant">Tuition Grant / Direct Scholarship</option>
                <option value="Unpaid">Unpaid / Academic Credit</option>
              </select>
            </div>

            <!-- 8. Timing & Modality -->
            <div class="grid grid-cols-2 gap-2">

                  <option value="ALL">Any Term</option>
                  <option value="Summer">Summer</option>
                  <option value="Academic Year">Academic Year</option>
                  <option value="Fall">Fall</option>
                  <option value="Spring">Spring</option>
                </select>
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1.5">8b. Modality</label>

                  <option value="0">0 Letters (No Recs Needed / Fast Apply)</option>
                  <option value="1">At Most 1 Letter</option>
                  <option value="2">At Most 2 Letters</option>
                </select>
              </div>

              <!-- 12. University Nomination Required -->
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1.5">12. Institutional Nomination</label>
                <select id="nomination-filter" class="w-full text-xs px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-sky-500 bg-white">
                  <option value="ALL">Any Application Path</option>
                  <option value="DIRECT">Direct Application Only (No School Endorsement)</option>
                  <option value="NOMINATION">Requires University Nomination</option>
                </select>
              </div>

              <!-- 13. Prior Experience Level -->
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1.5">13. Prior Experience Level</label>
                <select id="experience-filter" class="w-full text-xs px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-sky-500 bg-white">
                  <option value="ALL">Any Experience Level</option>
                  <option value="BEGINNER">Beginner / First-Time Researchers Welcomed</option>
                  <option value="PRIOR_REQUIRED">Prior Experience / Upper-Level Needed</option>
                </select>
              </div>

              <!-- 14. Geographic Restrictions -->
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1.5">14. Geographic Scope</label>
                <select id="geography-filter" class="w-full text-xs px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-sky-500 bg-white">
                  <option value="ALL">Any Geographic Scope</option>
                  <option value="Nationwide">Nationwide (Open to Any US Student)</option>
                  <option value="Global">Global / International Host</option>
                </select>
              </div>

              <!-- 15. Institution Focus -->
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1.5">15. Institutional Priority</label>
                <select id="institution-filter" class="w-full text-xs px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-sky-500 bg-white">
                  <option value="ALL">All Institution Types</option>
                  <option value="NON_R1">Prioritizes Students from Non-R1 / CC / MSI</option>
                  <option value="CC_FRIENDLY">Community College Explicitly Eligible</option>
                </select>
              </div>

            </div>
          </div>

        </div>
      </aside>

      <!-- Search Results Area (8 Cols) -->
      <section class="lg:col-span-8 xl:col-span-8">
        
        <!-- Results Banner -->
        <div class="bg-white rounded-xl border border-slate-200 p-4 mb-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3 shadow-xs">
          <div>
            <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Filtered Matches</span>
            <p class="text-sm font-semibold text-slate-700">

          </div>
          <div class="flex items-center gap-2">
            <span class="text-xs text-slate-500 font-medium">Sort:</span>
            <select id="sort-select" class="text-xs border border-slate-200 rounded-lg px-2.5 py-1.5 bg-slate-50 font-semibold text-slate-700 focus:outline-none">
              <option value="DEADLINE_SOON">Deadline (Soonest First)</option>
              <option value="TITLE_ASC">Title (A-Z)</option>
              <option value="MIN_GPA_ASC">Min GPA (Lowest First)</option>
            </select>
          </div>
        </div>

        <!-- Opportunity Cards List -->
        <div id="cards-container" class="space-y-4">
          <!-- Populated by JavaScript -->
        </div>

      </section>

    </div>
  </main>

    // ==========================================
    // UI DOM REFERENCES
    // ==========================================
    // Core Elements
    const searchInput = document.getElementById('search-input');
    const majorFilter = document.getElementById('major-filter');
    const standingFilter = document.getElementById('standing-filter');
    const categoryFilter = document.getElementById('category-filter');
    const citizenshipFilter = document.getElementById('citizenship-filter');
    const gpaSlider = document.getElementById('gpa-slider');
    const gpaVal = document.getElementById('gpa-val');
    const compensationFilter = document.getElementById('compensation-filter');
    const termFilter = document.getElementById('term-filter');
    const modalityFilter = document.getElementById('modality-filter');

    // Advanced Elements
    const toggleAdvancedBtn = document.getElementById('toggle-advanced-btn');
    const advancedChevron = document.getElementById('advanced-chevron');
    const advancedPanel = document.getElementById('advanced-filters-panel');
    const openDateFilter = document.getElementById('open-date-filter');
    const deadlineDateFilter = document.getElementById('deadline-date-filter');
    const rollingToggle = document.getElementById('rolling-toggle');
    const expiredToggle = document.getElementById('expired-toggle');
    const lettersFilter = document.getElementById('letters-filter');
    const nominationFilter = document.getElementById('nomination-filter');
    const experienceFilter = document.getElementById('experience-filter');
    const geographyFilter = document.getElementById('geography-filter');
    const institutionFilter = document.getElementById('institution-filter');

    // Display & Utilities
    const cardsContainer = document.getElementById('cards-container');
    const matchCount = document.getElementById('match-count');
    const resetBtn = document.getElementById('reset-filters');
    const sortSelect = document.getElementById('sort-select');

    // Toggle Advanced Panel
    toggleAdvancedBtn.addEventListener('click', () => {
      const isHidden = advancedPanel.classList.contains('hidden');
      if (isHidden) {
        advancedPanel.classList.remove('hidden');
        advancedChevron.classList.add('rotate-180');
      } else {
        advancedPanel.classList.add('hidden');
        advancedChevron.classList.remove('rotate-180');
      }
    });

    // GPA Slider Display
    gpaSlider.addEventListener('input', (e) => {
      gpaVal.textContent = parseFloat(e.target.value).toFixed(2);
      render();
    });

    // Reset Function
    resetBtn.addEventListener('click', () => {
      searchInput.value = '';
      majorFilter.value = 'ALL';
      standingFilter.value = 'ALL';
      categoryFilter.value = 'ALL';
      citizenshipFilter.value = 'ALL';
      gpaSlider.value = '3.00';
      gpaVal.textContent = '3.00';
      compensationFilter.value = 'ALL';
      termFilter.value = 'ALL';
      modalityFilter.value = 'ALL';

      openDateFilter.value = '';
      deadlineDateFilter.value = '';
      rollingToggle.checked = true;
      expiredToggle.checked = false;
      lettersFilter.value = 'ALL';
      nominationFilter.value = 'ALL';
      experienceFilter.value = 'ALL';
      geographyFilter.value = 'ALL';
      institutionFilter.value = 'ALL';
      sortSelect.value = 'DEADLINE_SOON';
      
      render();
    });

    // ==========================================
    // FILTERING & RENDERING LOGIC
    // ==========================================
    function render() {
      const q = searchInput.value.toLowerCase().trim();
      const major = majorFilter.value;
      const standing = standingFilter.value;
      const cat = categoryFilter.value;
      const citizen = citizenshipFilter.value;
      const userGpa = parseFloat(gpaSlider.value);
      const comp = compensationFilter.value;
      const term = termFilter.value;
      const modal = modalityFilter.value;

      // Advanced values
      const openDate = openDateFilter.value;
      const deadlineDate = deadlineDateFilter.value;
      const includeRolling = rollingToggle.checked;
      const includeExpired = expiredToggle.checked;
      const letters = lettersFilter.value;
      const nom = nominationFilter.value;
      const exp = experienceFilter.value;
      const geo = geographyFilter.value;
      const inst = institutionFilter.value;

      const today = new Date().toISOString().split('T')[0];

      let filtered = opportunities.filter(item => {
        // 1. Keyword search (title, org, description, tags)
        if (q) {
          const inTitle = item.title.toLowerCase().includes(q);
          const inOrg = item.organization.toLowerCase().includes(q);
          const inDesc = item.description.toLowerCase().includes(q);
          const inTags = item.majors.some(m => m.toLowerCase().includes(q));
          if (!inTitle && !inOrg && !inDesc && !inTags) return false;
        }

        // 2. Major matching (handles cross-listing & wildcards)
        if (major !== 'ALL') {
          const matchesDirect = item.majors.includes(major);
          const matchesAllStem = item.majors.includes("All STEM Disciplines");
          const matchesAll = item.majors.includes("All Majors / Any Field");
          if (!matchesDirect && !matchesAllStem && !matchesAll) return false;
        }

        // 3. Academic Standing
        if (standing !== 'ALL' && !item.standing.includes(standing)) return false;

        // 4. Category
        if (cat !== 'ALL' && item.category !== cat) return false;

        // 5. Citizenship
        if (citizen !== 'ALL' && !item.citizenship.includes(citizen)) return false;

        // 6. GPA (User GPA must qualify)
        if (item.minGpa > 0 && userGpa < item.minGpa) return false;

        // 7. Compensation
        if (comp !== 'ALL' && item.compensation !== comp) return false;

        // 8a. Term & 8b. Modality
        if (term !== 'ALL' && item.term !== term) return false;
        if (modal !== 'ALL' && item.modality !== modal) return false;

        // 9. Opens On or After
        if (openDate && item.opensDate && item.opensDate < openDate) return false;

        // 10. Deadlines (Calendar, Expired Toggle, Rolling)
        if (!includeRolling && item.isRolling) return false;
        if (!includeExpired && !item.isRolling && item.deadlineDate && item.deadlineDate < today) return false;
        if (deadlineDate && item.deadlineDate && item.deadlineDate > deadlineDate) return false;

        // 11. Letters of Rec
        if (letters === '0' && item.lettersOfRec > 0) return false;
        if (letters === '1' && item.lettersOfRec > 1) return false;
        if (letters === '2' && item.lettersOfRec > 2) return false;

        // 12. University Nomination
        if (nom === 'DIRECT' && item.nominationRequired) return false;
        if (nom === 'NOMINATION' && !item.nominationRequired) return false;

        // 13. Experience Level
        if (exp !== 'ALL' && item.experienceLevel !== exp) return false;

        // 14. Geography
        if (geo !== 'ALL' && item.geographicScope !== geo) return false;

        // 15. Institution Focus
        if (inst === 'NON_R1' && item.institutionFocus !== 'NON_R1' && item.institutionFocus !== 'CC_FRIENDLY') return false;
        if (inst === 'CC_FRIENDLY' && item.institutionFocus !== 'CC_FRIENDLY') return false;

        return true;
      });

      // Sorting
      const sortMode = sortSelect.value;
      filtered.sort((a, b) => {
        if (sortMode === 'DEADLINE_SOON') {
          if (a.isRolling) return 1;
          if (b.isRolling) return -1;
          return (a.deadlineDate || '9999') > (b.deadlineDate || '9999') ? 1 : -1;
        }
        if (sortMode === 'TITLE_ASC') return a.title.localeCompare(b.title);
        if (sortMode === 'MIN_GPA_ASC') return a.minGpa - b.minGpa;
        return 0;
      });

      matchCount.textContent = filtered.length;

      // Render Cards HTML
      if (filtered.length === 0) {
        cardsContainer.innerHTML = `
          <div class="bg-white border border-slate-200 p-12 rounded-2xl text-center shadow-xs">
            <div class="w-12 h-12 bg-sky-50 text-sky-600 rounded-full flex items-center justify-center mx-auto mb-3 font-bold text-lg">?</div>
            <p class="text-slate-800 font-bold text-base">No opportunities matched your exact filter combination.</p>
            <p class="text-xs text-slate-400 mt-1 max-w-sm mx-auto">Try clearing your date ranges, adjusting your GPA slider, or toggling "Include Expired" to see past cycles.</p>
            <button onclick="document.getElementById('reset-filters').click()" class="mt-4 px-4 py-2 bg-sky-600 text-white rounded-lg text-xs font-bold hover:bg-sky-700 transition">Clear Filters</button>
          </div>
        `;
        return;
      }

      cardsContainer.innerHTML = filtered.map(item => {
        const isClosed = !item.isRolling && item.deadlineDate && item.deadlineDate < today;
        
        return `
          <article class="bg-white rounded-2xl border border-slate-200 p-6 hover:shadow-md hover:border-slate-300 transition-all">
            
            <!-- Card Top Header -->
            <div class="flex flex-col sm:flex-row sm:items-start justify-between gap-3 mb-2.5">
              <div>
                <div class="flex flex-wrap items-center gap-1.5 mb-1.5">
                  <span class="px-2.5 py-0.5 text-[11px] font-bold rounded-md bg-slate-100 text-slate-700">
                    ${item.category}
                  </span>
                  <span class="px-2 py-0.5 text-[11px] font-semibold rounded-md bg-sky-50 text-sky-700 border border-sky-100">
                    ${item.term} • ${item.modality}
                  </span>
                  ${item.nominationRequired ? `
                    <span class="px-2 py-0.5 text-[11px] font-bold rounded-md bg-amber-50 text-amber-800 border border-amber-200">
                      University Nomination Required
                    </span>
                  ` : ''}
                  ${item.lettersOfRec === 0 ? `
                    <span class="px-2 py-0.5 text-[11px] font-semibold rounded-md bg-emerald-50 text-emerald-800 border border-emerald-200">
                      0 Letters of Rec
                    </span>
                  ` : ''}
                  ${item.experienceLevel === 'BEGINNER' ? `
                    <span class="px-2 py-0.5 text-[11px] font-medium rounded-md bg-indigo-50 text-indigo-700">
                      Beginner Friendly
                    </span>
                  ` : ''}
                </div>
                <h3 class="text-lg font-black text-slate-900 leading-snug">${item.title}</h3>
                <p class="text-xs font-bold text-slate-500">${item.organization}</p>
              </div>

              <a href="${item.link}" target="_blank" rel="noopener noreferrer" 
                 class="inline-flex items-center justify-center px-4 py-2 bg-slate-900 hover:bg-sky-600 text-white text-xs font-bold rounded-xl transition-colors shrink-0 shadow-xs">
                Official Portal →
              </a>
            </div>

            <!-- Description -->
            <p class="text-xs text-slate-600 mb-4 leading-relaxed line-clamp-3">${item.description}</p>

            <!-- Key Metadata Strip -->
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 py-2.5 px-3 bg-slate-50 rounded-xl border border-slate-100 text-[11px] text-slate-600 mb-4">
              <div>
                <span class="block text-[10px] uppercase font-bold text-slate-400">Min GPA</span>
                <span class="font-bold text-slate-800">${item.minGpa === 0 ? 'None' : item.minGpa.toFixed(2)}</span>
              </div>
              <div>
                <span class="block text-[10px] uppercase font-bold text-slate-400">Application Cycle</span>
                <span class="font-bold ${isClosed ? 'text-rose-600' : 'text-slate-800'}">
                  ${item.isRolling ? 'Rolling Admissions' : item.deadlinesText}
                  ${isClosed ? ' (Passed)' : ''}
                </span>
              </div>
              <div>
                <span class="block text-[10px] uppercase font-bold text-slate-400">Letters of Rec</span>
                <span class="font-bold text-slate-800">${item.lettersOfRec} Required</span>
              </div>
              <div>
                <span class="block text-[10px] uppercase font-bold text-slate-400">Citizenship</span>
                <span class="font-bold text-slate-800 truncate block" title="${item.citizenship.join(', ')}">${item.citizenship.join(', ')}</span>
              </div>
            </div>

            <!-- Funding Callout & Tags Footer -->
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 pt-1 border-t border-slate-100">
              <div class="text-xs font-semibold text-emerald-700 flex items-center gap-1.5">
                <span class="text-sm">💵</span>
                <span>${item.stipendText}</span>
              </div>
              <div class="flex items-center gap-1.5 flex-wrap">
                <span class="text-[10px] font-bold text-slate-400 uppercase">Target:</span>
                <span class="px-2 py-0.5 text-[10px] font-medium bg-slate-100 text-slate-600 rounded">
                  ${item.standing.slice(0, 3).join(', ')}${item.standing.length > 3 ? '...' : ''}
                </span>
              </div>
            </div>

          </article>
        `;
      }).join('');
    }

    // Attach Event Listeners to all controls
    const allFilters = [
      searchInput, majorFilter, standingFilter, categoryFilter, citizenshipFilter,
      compensationFilter, termFilter, modalityFilter, openDateFilter, deadlineDateFilter,
      rollingToggle, expiredToggle, lettersFilter, nominationFilter, experienceFilter,
      geographyFilter, institutionFilter, sortSelect
    ];

    allFilters.forEach(element => {
      element.addEventListener('input', render);
      element.addEventListener('change', render);
    });

    // Run on boot
    render();
  </script>
